[package]
name = "devicedock"
version = "0.2.0"
edition = "2021"
publish = false
[lib]
name = "devicedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
default = []
native-smoke = []
native-ble = ["dep:bluest", "dep:uuid", "dep:tokio-util"]
native-spp = []
[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serialport = "4"
bluest = { version = "0.6.9", optional = true }
uuid = { version = "1", features = ["serde"], optional = true }
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "process", "io-util"] }
axum = "0.8"
tauri-plugin-updater = "2"
portable-update-common = { path = "../portable-update-common" }
getrandom = "0.4"
tokio-util = { version = "0.7", optional = true }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Registry", "Win32_Devices_Communication", "Win32_Devices_Bluetooth", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinSock"] }

[dev-dependencies]
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
