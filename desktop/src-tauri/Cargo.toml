[package]
name = "devicedock"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
name = "devicedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
default = []
native-smoke = []
native-ble = ["dep:bluest", "dep:uuid", "dep:tokio", "dep:tokio-util"]
native-spp = ["dep:tokio"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serialport = "4"
bluest = { version = "0.6.9", optional = true }
uuid = { version = "1", features = ["serde"], optional = true }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"], optional = true }
tokio-util = { version = "0.7", optional = true }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_System_Registry", "Win32_Devices_Communication", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock"] }
