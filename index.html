<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' devicedock-extension: http://devicedock-extension.localhost; style-src 'self'; connect-src 'self' devicedock-extension: http://devicedock-extension.localhost https: ipc: http://ipc.localhost; img-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"><title>DeviceDock · 通信工作台</title><link rel="stylesheet" href="style.css"><script type="module" src="src/app.js"></script></head>
<body><header><a class="brand" href="./">D<span>DeviceDock</span></a><span class="subtitle">通信工作台</span><span id="platform" class="badge"></span><span class="version">v0.1.0</span></header>
<main><nav><button data-page="workbench" aria-pressed="true">通信调试</button><button data-page="extensions" aria-pressed="false">扩展管理</button><button data-page="sources" aria-pressed="false">仓库来源</button></nav>
<div class="workspace"><section id="workbench"><div class="page-heading"><div><small>WORKSPACE</small><h1>连接设备，开始调试</h1><p>每路独立连接、收发与解析。设备工具通过扩展接入。</p></div><label id="dual-label"><input id="dual" type="checkbox"> 启用 B 路</label></div><div id="lanes"></div></section>
<section id="extensions" hidden><div class="page-heading"><div><small>EXTENSIONS</small><h1>扩展管理</h1><p>安装仅保存包；勾选信任后，启用才会执行代码。扩展拥有页面权限。</p></div></div><div class="panel"><label class="file-button">导入本地扩展包 <input id="package-file" type="file" accept=".json"></label><label><input id="trust" type="checkbox"> 我信任所选扩展的作者，允许执行代码</label><p class="muted">本地 JSON 包由集成工具生成；也可从仓库目录安装。保留旧版本可在停用后重新启用。</p><div id="package-list"></div></div></section>
<section id="sources" hidden><div class="page-heading"><div><small>CATALOGS</small><h1>协议与插件仓库</h1><p>来源只提供目录，不会在添加后执行任何代码。离线时保留最近验证的目录。</p></div></div><form id="source-form" class="panel source-form"><select id="source-kind"><option value="protocol">协议仓库</option><option value="plugin">插件仓库</option></select><input id="source-url" type="url" required placeholder="https://github.com/组织/仓库" aria-label="仓库 URL"><button>添加来源</button></form><div id="source-list"></div></section>
<div id="extension-mounts"></div></div></main><div id="status" role="status" aria-live="polite">就绪 · 尚未连接设备</div>
<dialog id="port-dialog"><form method="dialog"><h2>选择串口</h2><select id="native-port" aria-label="可用串口"></select><div class="actions"><button value="cancel">取消</button><button value="open">选择</button></div></form></dialog>
<template id="lane-template"><article class="lane panel"><div class="lane-heading"><h2></h2><span class="connection-state">未连接</span><select class="transport" aria-label="传输方式"></select><button class="connect primary">连接设备</button></div><div class="settings"><label>波特率<input class="baud" type="number" min="1" max="4000000" value="115200"></label><label>数据位<select class="data-bits"><option>8</option><option>7</option></select></label><label>停止位<select class="stop-bits"><option>1</option><option>2</option></select></label><label>校验<select class="parity"><option value="none">无</option><option value="even">偶校验</option><option value="odd">奇校验</option></select></label><label>流控<select class="flow-control"><option value="none">无</option><option value="hardware">硬件</option></select></label><label>协议<select class="protocol"><option value="">原始数据</option></select></label></div><div class="log-bar"><strong>收发日志</strong><select class="display" aria-label="日志格式"><option value="hex">HEX</option><option value="text">TEXT</option><option value="both">HEX + TEXT</option></select><button class="replay">重新解析</button><button class="export">导出</button><button class="clear">清空</button></div><div class="logs" aria-label="收发日志"><p class="empty">连接设备后，这里将显示原始收发数据。</p></div><form class="send-form"><select class="send-format" aria-label="发送格式"><option value="hex">HEX</option><option value="text">TEXT</option></select><input class="send-input" placeholder="输入待发送数据，如 68 01 02 16" aria-label="待发送内容"><label><input class="crlf" type="checkbox"> CRLF</label><button class="primary">发送</button></form></article></template></body></html>
