name: Desktop release
# dev 版本提交自动构建预览版；main 正式版推送 desktop-main-v<版本> tag 触发。
# 同一版本号只发布一次：版本没变(文档、内部改动)的推送直接跳过构建。
on:
  push:
    branches: [dev]
    tags: [desktop-main-v*]
    paths:
      - package.json
      - .github/workflows/desktop-release.yml
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Markdown)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ startsWith(github.ref, 'refs/tags/desktop-main-v') && 'main' || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      publish: ${{ steps.meta.outputs.publish }}
      updater: ${{ steps.meta.outputs.updater }}
      apple: ${{ steps.meta.outputs.apple }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test desktop/scripts/desktop-resources.test.mjs desktop/scripts/updater-manifest.test.mjs desktop/scripts/prune-dev-releases.test.mjs desktop/scripts/portable-windows.test.mjs
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "desktop-main-v$version" ]; then
              echo "::error::Release tag must match package.json"; exit 1
            fi
            main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            if [ "$GITHUB_SHA" != "$main_sha" ]; then
              echo "::error::Official release tag must point to main HEAD"; exit 1
            fi
            REF_NAME=main
          fi
          case "$REF_NAME" in main|dev) ;; *) echo "::error::Publish only from main or dev"; exit 1 ;; esac
          updater=false
          if [ -n "$UPDATER_KEY" ] && [ -n "$UPDATER_PUBLIC_KEY" ]; then updater=true; fi
          apple=true
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then apple=false; fi
          done
          # 正式版必须带更新签名(否则已装的客户端收不到这一版)；缺 Apple 签名公证时两个通道都出整包 ad-hoc 签名的 macOS 包
          if [ "$REF_NAME" = main ] && [ "$updater" != true ]; then
            echo "::error::main release requires updater signing secrets"; exit 1
          fi
          publish=true
          if gh release view "desktop-$REF_NAME-v$version" > /dev/null 2>&1; then
            publish=false
            echo "::notice::desktop-$REF_NAME-v$version already released; bump package.json to publish again"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "updater=$updater" >> "$GITHUB_OUTPUT"
          echo "apple=$apple" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ needs.prepare.outputs.updater == 'true' && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Configure npm cache and inspect public compiler identity
        id: compiler
        run: node desktop/scripts/cache-key.mjs
      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/devicedock-npm-cache/_cacache
          key: npm-download-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'desktop/package-lock.json') }}
          restore-keys: |
            npm-download-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore cargo-source cache
        id: cargo-source-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
          key: cargo-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.rust }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/portable-update-common/Cargo.lock', 'desktop/portable-updater/Cargo.toml') }}
          restore-keys: |
            cargo-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.rust }}-
      - name: Restore cargo-target cache
        id: cargo-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        continue-on-error: true
        with:
          path: |
            desktop/src-tauri/target/
            !desktop/src-tauri/target/**/bundle/**
            !desktop/src-tauri/target/**/*.app/**
            !desktop/src-tauri/target/**/*.dmg
            !desktop/src-tauri/target/**/*.tar.gz
            !desktop/src-tauri/target/**/*.zip
            !desktop/src-tauri/target/**/*.sig
            !desktop/src-tauri/target/**/devicedock
            !desktop/src-tauri/target/**/devicedock.exe
            !desktop/src-tauri/target/**/devicedock-updater
            !desktop/src-tauri/target/**/devicedock-updater.exe
            !desktop/src-tauri/target/**/deps/*devicedock*
            !desktop/src-tauri/target/**/deps/*portable_updater*
            !desktop/src-tauri/target/**/build/devicedock-*/**
            !desktop/src-tauri/target/**/build/portable-updater-*/**
            !desktop/src-tauri/target/**/.fingerprint/devicedock-*/**
            !desktop/src-tauri/target/**/.fingerprint/portable-updater-*/**
            !desktop/src-tauri/target/**/incremental/devicedock*/**
            !desktop/src-tauri/target/**/incremental/portable_updater*/**
          key: cargo-target-v1-native-ble-spp-debug-release-remap1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.compiler.outputs.rust }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/portable-update-common/Cargo.lock', 'desktop/portable-updater/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-v1-native-ble-spp-debug-release-remap1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.compiler.outputs.rust }}-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/portable-update-common/Cargo.lock', 'desktop/portable-updater/Cargo.toml') }}-
            cargo-target-v1-native-ble-spp-debug-release-remap1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.compiler.outputs.rust }}-
      - run: npm ci
      - name: Import Developer ID certificate into temporary keychain
        if: runner.os == 'macOS' && needs.prepare.outputs.apple == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/desktop-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          python3 - <<'PYCODE'
          import base64, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'desktop-certificate.p12'), 'wb') as f:
              f.write(base64.b64decode(os.environ['APPLE_CERTIFICATE'], validate=True))
          PYCODE
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/desktop-certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/desktop-certificate.p12"
      - run: npm ci
        working-directory: desktop
      - name: Verify portable ZIP packaging
        if: runner.os == 'Windows'
        run: node --test desktop/scripts/portable-windows.test.mjs
      - name: Verify native driver build
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --features native-ble,native-spp --lib
      - name: Verify Windows test activation manifest
        if: success() && runner.os == 'Windows'
        run: python desktop/scripts/windows-loader-diagnostics.py --verify-test-manifests
      - name: Diagnose Windows test loader
        if: failure() && runner.os == 'Windows'
        run: python desktop/scripts/windows-loader-diagnostics.py
      - name: Build desktop artifacts
        working-directory: desktop
        shell: bash
        env:
          APPLE_SIGNING: ${{ needs.prepare.outputs.apple }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 没有 Apple 凭据时不能留空变量给 tauri，否则它会按配置了签名去找证书
          if [ "$APPLE_SIGNING" != true ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          [ -n "$TAURI_UPDATER_PUBLIC_KEY" ] || unset TAURI_UPDATER_PUBLIC_KEY
          npm run build -- --features native-ble,native-spp --target ${{ matrix.target }}
      - name: Verify Windows application activation manifest
        if: success() && runner.os == 'Windows'
        run: python desktop/scripts/windows-loader-diagnostics.py --verify-app-manifests
      - name: Verify portable update artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          UPDATER: ${{ needs.prepare.outputs.updater }}
        run: |
          # 便携 ZIP 就是应用内更新载荷：必须含主程序与 helper；配了更新签名时还必须带 .sig，
          # 否则清单会缺 windows-x86_64，Windows 客户端永远收不到这一版。
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync, mkdtempSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          import { tmpdir } from 'node:os';
          import { spawnSync } from 'node:child_process';
          const dir = join('desktop', 'release', process.env.RELEASE_CHANNEL);
          const zips = readdirSync(dir).filter((n) => /^DeviceDock_\d+\.\d+\.\d+_windows_x64\.zip$/.test(n));
          if (zips.length !== 1) throw new Error(`expected exactly one portable ZIP, found ${zips.length}`);
          const zip = join(dir, zips[0]);
          if (process.env.UPDATER === 'true') {
            const sig = readFileSync(zip + '.sig', 'utf8').trim();
            if (!sig) throw new Error('portable ZIP has no update signature');
            const trusted = Buffer.from(sig, 'base64').toString('utf8');
            const version = /\bversion:(\d+\.\d+\.\d+)/.exec(trusted);
            if (!version) throw new Error('signature does not record the app version');
            console.log(`portable ZIP signed for version ${version[1]}`);
          }
          const out = mkdtempSync(join(tmpdir(), 'zip-check-'));
          const r = spawnSync('powershell.exe', ['-NoProfile', '-NonInteractive', '-Command', 'Expand-Archive -LiteralPath $env:Z -DestinationPath $env:D'], { env: { ...process.env, Z: zip, D: out } });
          if (r.status !== 0) throw new Error('portable ZIP cannot be extracted');
          const entries = readdirSync(out).sort();
          const needed = ['DeviceDock.exe', 'README.txt', 'devicedock-updater.exe'];
          for (const name of needed) if (!entries.includes(name)) throw new Error(`portable ZIP is missing ${name}`);
          if (readFileSync(join(out, 'DeviceDock.exe')).length < 1024) throw new Error('portable ZIP program looks truncated');
          rmSync(out, { recursive: true, force: true });
          console.log('portable ZIP contents verified: ' + entries.join(', '));
          JS
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS' && needs.prepare.outputs.apple == 'true'
        run: |
          python3 - <<'PY'
          import os, shlex, subprocess
          path = os.path.join(os.environ['RUNNER_TEMP'], 'original-keychains.txt')
          if os.path.exists(path):
              with open(path) as f: keychains = shlex.split(f.read())
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *keychains], check=True)
          PY
          security delete-keychain "$RUNNER_TEMP/desktop-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/desktop-certificate.p12"
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.name }}
          path: desktop/release/${{ needs.prepare.outputs.channel }}/
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      UPDATER: ${{ needs.prepare.outputs.updater }}
      APPLE: ${{ needs.prepare.outputs.apple }}
      RELEASE_NOTES: ${{ inputs.notes }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Write release notes
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          let notes = (e.RELEASE_NOTES || '').trim();
          if (!notes) notes = e.CHANNEL === 'dev'
            ? `预览版，构建自 dev 分支 ${e.GITHUB_SHA.slice(0, 7)}。\n\n${(e.COMMIT_MESSAGE || '').split('\n')[0]}`
            : `DeviceDock ${e.VERSION}`;
          if (e.APPLE !== 'true') notes += '\n\n> macOS 安装包未经 Apple 签名公证：首次打开被拦截时点「完成」，到「系统设置 → 隐私与安全性」底部点「仍要打开」并输入密码。若仍提示「已损坏」，在终端执行 `xattr -cr "/Applications/DeviceDock.app"` 后再打开。';
          notes += '\n\nWindows 提供 ZIP 免安装版：解压后运行 DeviceDock.exe，需要系统已安装 Microsoft Edge WebView2 Runtime。程序内可直接检查并安装更新(下载、验签后在退出时替换程序并自动重启)；也可以手动关闭程序后解压新版覆盖。';
          if (e.UPDATER !== 'true') notes += '\n\n> 此版本未启用应用内更新，新版本请到 Releases 页下载。';
          writeFileSync('release-notes.md', notes + '\n');
          JS
      - name: Build updater manifest
        if: env.UPDATER == 'true'
        run: |
          # Only a missing channel release is accepted; network/auth failures abort.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const releases = JSON.parse(readFileSync('releases.json', 'utf8')).flat();
          writeFileSync('pointer-exists', releases.some(r => r.tag_name === `desktop-${process.env.CHANNEL}`) ? 'yes' : 'no');
          JS
          if [ "$(cat pointer-exists)" = yes ]; then
            gh release download "desktop-$CHANNEL" --pattern latest.json --dir previous
          fi
          # 清单必须同时覆盖 macOS 与 Windows 便携版；任一平台缺包或缺签名，脚本直接失败
          node desktop/scripts/updater-manifest.mjs artifacts "$VERSION" "$CHANNEL" latest.json previous/latest.json release-notes.md
          node -e "const m=require('./latest.json');for(const k of ['darwin-aarch64','windows-x86_64'])if(!m.platforms[k])throw new Error('manifest is missing '+k)"
      - name: Publish immutable version release
        run: |
          TAG="desktop-$CHANNEL-v$VERSION"
          PRERELEASE=()
          if [ "$CHANNEL" = dev ]; then PRERELEASE=(--prerelease --latest=false); fi
          TITLE="$VERSION"
          if [ "$CHANNEL" = dev ]; then TITLE="$VERSION pre"; fi
          gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --draft "${PRERELEASE[@]}" --title "$TITLE" --notes-file release-notes.md
          gh release edit "$TAG" --draft=false
      - name: Advance updater channel pointer
        if: env.UPDATER == 'true'
        run: |
          PRERELEASE=()
          if [ "$CHANNEL" = dev ]; then PRERELEASE=(--prerelease); fi
          if [ "$(cat pointer-exists)" = no ]; then
            gh release create "desktop-$CHANNEL" latest.json --target "$GITHUB_SHA" --draft "${PRERELEASE[@]}" --latest=false --title "Desktop $CHANNEL update channel" --notes "Updater channel manifest. Download desktop packages from version releases."
            gh release edit "desktop-$CHANNEL" --draft=false
          else
            node desktop/scripts/update-channel-pointer.mjs "$CHANNEL" latest.json
          fi
      # 预览版只保留最新 1 个版本 release；清理失败只告警，不影响已发布结果。
      - name: Prune old dev releases
        if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.channel == 'dev'
        run: node desktop/scripts/prune-dev-releases.mjs
