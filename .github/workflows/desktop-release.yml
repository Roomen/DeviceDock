name: Desktop release
# 发布由改了 js/version.js 的主干推送触发：main 出正式版，dev 出预览版。
# 触发挂在主干分支上而不是 tag：GitHub Actions 的缓存按 ref 隔离，tag 触发的作业
# 读不到 main 的缓存，每次发版都要全量重编 Rust。desktop-main-v<版本> tag 由本工作流
# 在 publish 里创建，不需要手动推 tag。
# 同一版本号只发布一次：版本没变(文档、内部改动)的推送直接跳过构建。
on:
  push:
    branches: [main, dev]
    paths:
      - js/version.js
      - .github/workflows/desktop-release.yml
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Markdown)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  # 按通道(main / dev)串行，不取消进行中的发布：两个发布同时跑会抢同一个版本 release 与通道指针。
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      publish: ${{ steps.meta.outputs.publish }}
      updater: ${{ steps.meta.outputs.updater }}
      apple: ${{ steps.meta.outputs.apple }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test desktop/scripts/updater-manifest.test.mjs desktop/scripts/installer-templates.test.mjs desktop/scripts/prune-dev-releases.test.mjs desktop/scripts/portable-windows.test.mjs
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          version=$(node -e "const m=require('fs').readFileSync('js/version.js','utf8').match(/APP_VERSION\s*=\s*['\"](\d+\.\d+\.\d+)['\"]/);if(!m)process.exit(1);console.log(m[1])")
          # 通道就是触发分支：main 出正式版，dev 出预览版；正式版的 tag 在 publish 里创建。
          case "$REF_NAME" in main|dev) ;; *) echo "::error::Publish only from main or dev (got $REF_NAME)"; exit 1 ;; esac
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::Publish only from a main or dev push (got ref type $GITHUB_REF_TYPE)"; exit 1
          fi
          updater=false
          if [ -n "$UPDATER_KEY" ] && [ -n "$UPDATER_PUBLIC_KEY" ]; then updater=true; fi
          apple=true
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then apple=false; fi
          done
          # 正式版必须带更新签名(否则已装的客户端收不到这一版)；缺 Apple 签名公证时两个通道都出整包 ad-hoc 签名的 macOS 包
          if [ "$REF_NAME" = main ] && [ "$updater" != true ]; then
            echo "::error::main release requires updater signing secrets"; exit 1
          fi
          publish=true
          if gh release view "desktop-$REF_NAME-v$version" > /dev/null 2>&1; then
            publish=false
            echo "::notice::desktop-$REF_NAME-v$version already released; bump js/version.js to publish again"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "updater=$updater" >> "$GITHUB_OUTPUT"
          echo "apple=$apple" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ needs.prepare.outputs.updater == 'true' && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.outputs.updater == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Windows 用 rust-lld 链接：随 Rust 工具链一起装，比 MSVC link.exe 快。
      # rustc 认得这个名字，会自己补 `-flavor link`（rust-lld 单独跑不认 msvc 风格参数）。
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'rust-lld.exe' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # 只有本作业真的跑 npm ci，才挂 npm 缓存；缓存的是安装包下载，不含构建产物。
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Windows 便携包要编 helper，所以三个 workspace 一起进缓存。
      # shared-key 与 ci 按 OS 对齐（同一平台的 registry 与依赖包只存一份），
      # key 带 release 与 target：release profile 的产物与 ci 的 debug/test 互不覆盖，
      # 交叉编译 target 也各自独立。发布的安装包、签名文件不在 workspace 内，不会进缓存。
      # 只有 main 正式版发布才写缓存（tag 触发已取消，正式版就是 main 的推送），
      # dev 分支构建与手动派发只读恢复。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            desktop/portable-update-common
            desktop/portable-updater
          shared-key: cargo-${{ runner.os }}
          key: release-${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Import Developer ID certificate into temporary keychain
        if: runner.os == 'macOS' && needs.prepare.outputs.apple == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/desktop-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          python3 - <<'PYCODE'
          import base64, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'desktop-certificate.p12'), 'wb') as f:
              f.write(base64.b64decode(os.environ['APPLE_CERTIFICATE'], validate=True))
          PYCODE
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/desktop-certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/desktop-certificate.p12"
      - run: npm ci
        working-directory: desktop
      - name: Verify portable ZIP packaging
        if: runner.os == 'Windows'
        run: node --test desktop/scripts/portable-windows.test.mjs
      - name: Build desktop artifacts
        working-directory: desktop
        shell: bash
        env:
          APPLE_SIGNING: ${{ needs.prepare.outputs.apple }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 没有 Apple 凭据时不能留空变量给 tauri，否则它会按配置了签名去找证书
          if [ "$APPLE_SIGNING" != true ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          [ -n "$TAURI_UPDATER_PUBLIC_KEY" ] || unset TAURI_UPDATER_PUBLIC_KEY
          npm run build -- --target ${{ matrix.target }}
      - name: Verify portable update artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          UPDATER: ${{ needs.prepare.outputs.updater }}
        run: |
          # 便携 ZIP 就是应用内更新载荷：必须含主程序与 helper；配了更新签名时还必须带 .sig，
          # 否则清单会缺 windows-x86_64，Windows 客户端永远收不到这一版。
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync, mkdtempSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          import { tmpdir } from 'node:os';
          import { spawnSync } from 'node:child_process';
          // 读 PE 可选头，列出 .rsrc 里登记的资源类型：3 图标 / 14 图标组 / 16 版本信息 / 24 应用清单。
          function peResourceTypes(name, buf) {
            if (buf.length < 0x40 || buf.readUInt16LE(0) !== 0x5a4d) throw new Error(name + ' is not a PE image');
            const pe = buf.readUInt32LE(0x3c);
            if (buf.readUInt32LE(pe) !== 0x00004550) throw new Error(name + ' is not a PE image');
            const coff = pe + 4;
            const sectionCount = buf.readUInt16LE(coff + 2);
            const optSize = buf.readUInt16LE(coff + 16);
            const opt = coff + 20;
            if (buf.readUInt16LE(opt) !== 0x20b) throw new Error(name + ' is not a PE32+ image');
            const rsrcRva = buf.readUInt32LE(opt + 128);
            const rsrcSize = buf.readUInt32LE(opt + 132);
            if (!rsrcRva || !rsrcSize) return new Set();
            const sections = [];
            for (let i = 0; i < sectionCount; i++) {
              const s = opt + optSize + i * 40;
              sections.push({
                va: buf.readUInt32LE(s + 12),
                size: Math.max(buf.readUInt32LE(s + 8), buf.readUInt32LE(s + 16)),
                raw: buf.readUInt32LE(s + 20),
              });
            }
            const section = sections.find((s) => rsrcRva >= s.va && rsrcRva < s.va + s.size);
            if (!section) throw new Error(name + ' resource table is not mapped');
            const base = section.raw + (rsrcRva - section.va);
            const count = buf.readUInt16LE(base + 12) + buf.readUInt16LE(base + 14);
            const types = new Set();
            for (let i = 0; i < count; i++) {
              const id = buf.readUInt32LE(base + 16 + i * 8);
              if (!(id & 0x80000000)) types.add(id);
            }
            return types;
          }
          const contains = (buf, needle) => buf.includes(Buffer.from(needle, 'utf8')) || buf.includes(Buffer.from(needle, 'utf16le'));
          const dir = join('desktop', 'release', process.env.RELEASE_CHANNEL);
          const zips = readdirSync(dir).filter((n) => /^DeviceDock_\d+\.\d+\.\d+_windows_x64\.zip$/.test(n));
          if (zips.length !== 1) throw new Error(`expected exactly one portable ZIP, found ${zips.length}`);
          const zip = join(dir, zips[0]);
          if (process.env.UPDATER === 'true') {
            const sig = readFileSync(zip + '.sig', 'utf8').trim();
            if (!sig) throw new Error('portable ZIP has no update signature');
            const trusted = Buffer.from(sig, 'base64').toString('utf8');
            const version = /\bversion:(\d+\.\d+\.\d+)/.exec(trusted);
            if (!version) throw new Error('signature does not record the app version');
            console.log(`portable ZIP signed for version ${version[1]}`);
          }
          const out = mkdtempSync(join(tmpdir(), 'zip-check-'));
          const r = spawnSync('powershell.exe', ['-NoProfile', '-NonInteractive', '-Command', 'Expand-Archive -LiteralPath $env:Z -DestinationPath $env:D'], { env: { ...process.env, Z: zip, D: out } });
          if (r.status !== 0) throw new Error('portable ZIP cannot be extracted');
          const entries = readdirSync(out).sort();
          const needed = ['DeviceDock.exe', 'README.txt', 'devicedock-updater.exe'];
          for (const name of needed) if (!entries.includes(name)) throw new Error(`portable ZIP is missing ${name}`);
          const program = readFileSync(join(out, 'DeviceDock.exe'));
          if (program.length < 1024) throw new Error('portable ZIP program looks truncated');

          // Windows 换成 rust-lld 后最容易静默丢的是资源段：链接照样成功，但没有应用清单时
          // comctl32 v6 不激活，程序一启动就缺 TaskDialogIndirect 这类 v6 专有入口（0xc0000139）。
          // 图标与版本信息同在一个资源文件里，一并核对。
          const programTypes = peResourceTypes('DeviceDock.exe', program);
          if (!programTypes.has(24)) throw new Error('DeviceDock.exe has no application manifest resource');
          if (!contains(program, '<assembly')) throw new Error('DeviceDock.exe has no embedded application manifest');
          if (!contains(program, 'Microsoft.Windows.Common-Controls')) throw new Error('DeviceDock.exe manifest does not require Common Controls 6');
          if (!programTypes.has(14) || !programTypes.has(3)) throw new Error('DeviceDock.exe has no icon resources');
          if (!programTypes.has(16)) throw new Error('DeviceDock.exe has no version info resource');

          // helper 没有 tauri-build 的资源，清单由它的 build.rs 自己用 /MANIFEST:EMBED 加，
          // 少了就没有 asInvoker：文件名含 "update" 会命中安装器检测，可能弹出 UAC 提权。
          const helper = readFileSync(join(out, 'devicedock-updater.exe'));
          if (!peResourceTypes('devicedock-updater.exe', helper).has(24)) throw new Error('devicedock-updater.exe has no application manifest resource');
          if (!contains(helper, 'requestedExecutionLevel')) throw new Error('devicedock-updater.exe manifest does not declare requestedExecutionLevel');
          rmSync(out, { recursive: true, force: true });
          console.log('portable ZIP contents verified: ' + entries.join(', '));
          JS
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS' && needs.prepare.outputs.apple == 'true'
        run: |
          python3 - <<'PY'
          import os, shlex, subprocess
          path = os.path.join(os.environ['RUNNER_TEMP'], 'original-keychains.txt')
          if os.path.exists(path):
              with open(path) as f: keychains = shlex.split(f.read())
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *keychains], check=True)
          PY
          security delete-keychain "$RUNNER_TEMP/desktop-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/desktop-certificate.p12"
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.name }}
          path: desktop/release/${{ needs.prepare.outputs.channel }}/
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      UPDATER: ${{ needs.prepare.outputs.updater }}
      APPLE: ${{ needs.prepare.outputs.apple }}
      RELEASE_NOTES: ${{ inputs.notes }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Write release notes
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          let notes = (e.RELEASE_NOTES || '').trim();
          if (!notes) notes = e.CHANNEL === 'dev'
            ? `预览版，构建自 dev 分支 ${e.GITHUB_SHA.slice(0, 7)}。\n\n${(e.COMMIT_MESSAGE || '').split('\n')[0]}`
            : `DeviceDock ${e.VERSION}`;
          if (e.APPLE !== 'true') notes += '\n\n> macOS 安装包未经 Apple 签名公证：首次打开被拦截时点「完成」，到「系统设置 → 隐私与安全性」底部点「仍要打开」并输入密码。若仍提示「已损坏」，在终端执行 `xattr -cr "/Applications/DeviceDock.app"` 后再打开。';
          notes += '\n\nWindows 提供 ZIP 免安装版：解压后运行 DeviceDock.exe，需要系统已安装 Microsoft Edge WebView2 Runtime。程序内可直接检查并安装更新(下载、验签后在退出时替换程序并自动重启)；也可以手动关闭程序后解压新版覆盖。';
          if (e.UPDATER !== 'true') notes += '\n\n> 此版本未启用应用内更新，新版本请到 Releases 页下载。';
          writeFileSync('release-notes.md', notes + '\n');
          JS
      - name: Build updater manifest
        if: env.UPDATER == 'true'
        run: |
          # Only a missing channel release is accepted; network/auth failures abort.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const releases = JSON.parse(readFileSync('releases.json', 'utf8')).flat();
          writeFileSync('pointer-exists', releases.some(r => r.tag_name === `desktop-${process.env.CHANNEL}`) ? 'yes' : 'no');
          JS
          if [ "$(cat pointer-exists)" = yes ]; then
            gh release download "desktop-$CHANNEL" --pattern latest.json --dir previous
          fi
          # 清单必须同时覆盖 macOS 与 Windows 便携版；任一平台缺包或缺签名，脚本直接失败
          node desktop/scripts/updater-manifest.mjs artifacts "$VERSION" "$CHANNEL" latest.json previous/latest.json release-notes.md
          node -e "const m=require('./latest.json');for(const k of ['darwin-aarch64','windows-x86_64'])if(!m.platforms[k])throw new Error('manifest is missing '+k)"
      - name: Publish immutable version release
        run: |
          TAG="desktop-$CHANNEL-v$VERSION"
          # tag 由这里创建：tag 还不存在时 gh release create --target 会在本次提交上建 tag。
          # tag 已存在而 release 不存在（上次只建了 tag 就失败、或 release 被手工删掉）时明确报错，
          # 不要覆盖既有 tag 指向的提交，交给人工确认后清理。
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG already exists but release $TAG does not; remove the tag or fix the release manually"; exit 1
          fi
          PRERELEASE=()
          if [ "$CHANNEL" = dev ]; then PRERELEASE=(--prerelease --latest=false); fi
          TITLE="$VERSION"
          if [ "$CHANNEL" = dev ]; then TITLE="$VERSION pre"; fi
          gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --draft "${PRERELEASE[@]}" --title "$TITLE" --notes-file release-notes.md
          gh release edit "$TAG" --draft=false
      - name: Advance updater channel pointer
        if: env.UPDATER == 'true'
        run: |
          PRERELEASE=()
          if [ "$CHANNEL" = dev ]; then PRERELEASE=(--prerelease); fi
          if [ "$(cat pointer-exists)" = no ]; then
            gh release create "desktop-$CHANNEL" latest.json --target "$GITHUB_SHA" --draft "${PRERELEASE[@]}" --latest=false --title "Desktop $CHANNEL update channel" --notes "Updater channel manifest. Download desktop packages from version releases."
            gh release edit "desktop-$CHANNEL" --draft=false
          else
            node desktop/scripts/update-channel-pointer.mjs "$CHANNEL" latest.json
          fi
      # 预览版只保留最新 1 个版本 release；清理失败只告警，不影响已发布结果。
      - name: Prune old dev releases
        if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.channel == 'dev'
        run: node desktop/scripts/prune-dev-releases.mjs
