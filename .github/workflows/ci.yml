name: Check
on:
  pull_request:
  push:
    branches-ignore: [dev]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run frontend regression tests
        run: |
          fail=0
          for f in tests/*.cjs; do
            echo "::group::$f"
            node "$f" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - run: node --test desktop/scripts/*.test.mjs
  cargo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # generate_context! 要求 frontendDist（desktop/dist）存在，cargo 之前先按发布流程复制一份网页文件。
      # stage-web 只用 node 内置模块，不需要 npm 依赖，也不读签名密钥。
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node desktop/scripts/stage-web.mjs
      - uses: dtolnay/rust-toolchain@stable
      # 缓存 ~/.cargo 与各 workspace 的 target 依赖产物（工作区自身产物不入缓存，增量构建已被 action 关掉）。
      # shared-key 按 OS 分平台、key 按 profile 区分：debug/test 与 release 的依赖产物不同，
      # 同一条缓存键被先写入者占住后另一 profile 就再也存不进去，所以两者各留一条条目；
      # ~/.cargo 的 registry 与下载缓存随条目一起保存，因此两条条目都免重复下载。
      # 只有主干 push 才写缓存，PR 与功能分支只读恢复，避免分支缓存挤掉主干。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            desktop/portable-update-common
            desktop/portable-updater
          shared-key: cargo-${{ runner.os }}
          key: debug
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - run: cargo test --manifest-path desktop/portable-update-common/Cargo.toml
      - run: cargo test --manifest-path desktop/portable-updater/Cargo.toml
