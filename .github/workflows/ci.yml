name: Check
on:
  pull_request:
  push:
    branches-ignore: [dev]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: node --test desktop/scripts/*.test.mjs
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --all-features
      - run: node tools/build.mjs --core
      - run: npm ci
        working-directory: desktop
      - run: npm run build -- --no-bundle --features native-ble,native-spp
        working-directory: desktop
